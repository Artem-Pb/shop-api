spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopdb}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
