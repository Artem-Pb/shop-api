services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: ${DB_USERNAME:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shop} -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopdb
      DB_USERNAME: ${DB_USERNAME:-shop}
      DB_PASSWORD: ${DB_PASSWORD:-shop123}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  pgdata:
